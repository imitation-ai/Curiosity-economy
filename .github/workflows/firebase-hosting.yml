name: Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: npm ci
      - run: python -m pip install -r scripts/requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: npm run check:publish
      - name: Build the committed book edition
        run: npm run build
        env:
          VITE_BETTERSTACK_APPLICATION_TOKEN: ${{ vars.VITE_BETTERSTACK_APPLICATION_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosting-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    needs: check
    if: github.repository == 'imitation-ai/Curiosity-economy' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: https://curiosity-economy.web.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosting-dist
          path: dist/
      - name: Check deployment configuration
        env:
          PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GOOGLE_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo '::error::Set GOOGLE_WIF_PROVIDER using scripts/setup-firebase-ci.sh'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo '::error::Set GOOGLE_DEPLOY_SERVICE_ACCOUNT using scripts/setup-firebase-ci.sh'; exit 1; }
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: curiosity-economy
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy the tested build
        run: npx --no-install firebase deploy --only hosting --project curiosity-economy --non-interactive
      - name: Verify the live edition
        run: node scripts/verify-live.mjs https://curiosity-economy.web.app
